<ion-header>
    <ion-toolbar>
        <ion-title>Países</ion-title>
    </ion-toolbar>
    <ion-toolbar>
        <ion-searchbar placeholder="Buscar por país o capital..." [(ngModel)]="terminoBusqueda"
            (ionInput)="filtrarPaises()"></ion-searchbar>
    </ion-toolbar>
</ion-header>

<ion-content>
    <div class="ion-text-center ion-padding" *ngIf="cargando">
        <ion-spinner></ion-spinner>
    </div>

    <div class="ion-text-center ion-padding" *ngIf="error">
        <p>No se pudieron cargar los países.</p>
        <ion-button (click)="cargarPaises()">Reintentar</ion-button>
    </div>

    <ion-list *ngIf="!cargando && !error && paisesFiltrados.length > 0">
        <ion-item button *ngFor="let pais of paisesFiltrados" (click)="verDetalle(pais)">
            <ion-thumbnail slot="start">
                <img [src]="pais.bandera" [alt]="'Bandera de ' + pais.nombre" />
            </ion-thumbnail>
            <ion-label>
                <h2>{{ pais.nombre }}</h2>
                <p>{{ pais.capital }}</p>
            </ion-label>
        </ion-item>
    </ion-list>

    <div class="ion-padding ion-text-center"
        *ngIf="!cargando && !error && paises.length > 0 && paisesFiltrados.length === 0">
        <p>No se encontraron países para "{{ terminoBusqueda }}".</p>
    </div>
</ion-content>
