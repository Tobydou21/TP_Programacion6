<ion-header>
    <ion-toolbar>
        <ion-title>Países</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content>
    <ion-list *ngIf="paises.length > 0">
        <ion-item *ngFor="let pais of paises">
            <ion-thumbnail slot="start">
                <img [src]="pais.bandera" [alt]="'Bandera de ' + pais.nombre" />
            </ion-thumbnail>
            <ion-label>
                <h2>{{ pais.nombre }}</h2>
                <p>{{ pais.capital }}</p>
            </ion-label>
        </ion-item>
    </ion-list>
</ion-content>
